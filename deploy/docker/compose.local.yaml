# Local build override for testing or building Splitline from source.
#
# Usage (from deploy/docker/):
#   APP_VERSION=$(git describe --tags --always --dirty) docker compose -f compose.yaml -f compose.local.yaml up -d --build

services:
    splitline:
        build:
            context: ../..
            dockerfile: deploy/docker/Dockerfile
            args:
                APP_VERSION: ${APP_VERSION:-dev}
        image: splitline:local
