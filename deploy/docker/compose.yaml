# Splitline — Self-Hosting Docker Compose Template
#
# Quick start:
#   cp .env.example .env
#   # Edit .env to set TIMEZONE, GARMIN_KEY, and APP_URL
#   docker compose up -d
#
# Security: Splitline serves plain HTTP on port 8080 and delegates authentication
# and TLS to your upstream reverse proxy or private network (Tailscale, Cloudflare
# Access, Authelia, Authentik, or Caddy/Nginx auth). Do not expose port 8080
# directly to the public internet without upstream authentication.

services:
    splitline:
        image: ghcr.io/splitline-php/splitline:latest
        container_name: splitline
        restart: unless-stopped
        ports:
            - '8080:8080'
        environment:
            # Core application settings
            APP_URL: ${APP_URL:-http://localhost:8080}
            # Display timezone for activity dates, streaks, and daily telemetry.
            # Defaults to UTC; also honors standard container TZ if TIMEZONE is unset.
            TIMEZONE: ${TIMEZONE:-UTC}
            TZ: ${TIMEZONE:-UTC}
            # Default measurement system for first run: metric | imperial
            DEFAULT_UNITS: ${DEFAULT_UNITS:-metric}
            # Default sports navigation mode: auto | custom
            DEFAULT_SPORTS_MODE: ${DEFAULT_SPORTS_MODE:-auto}

            # Data provider — Garmin Connect Personal API
            GARMIN_KEY: ${GARMIN_KEY:-}
            GARMIN_AUTO_SYNC_STREAMS: ${GARMIN_AUTO_SYNC_STREAMS:-true}

            # Optional: Open-Meteo historical activity weather (free, no API key required)
            OPEN_METEO_ENABLED: ${OPEN_METEO_ENABLED:-true}
            OPEN_METEO_AUTO_SYNC: ${OPEN_METEO_AUTO_SYNC:-true}

            # Optional: OpenStreetMap Nominatim reverse geocoding (ODbL)
            NOMINATIM_ENABLED: ${NOMINATIM_ENABLED:-true}
            NOMINATIM_AUTO_SYNC: ${NOMINATIM_AUTO_SYNC:-true}
            NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
            NOMINATIM_RATE_LIMIT_MS: ${NOMINATIM_RATE_LIMIT_MS:-1100}
            NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-}
            NOMINATIM_REFERER: ${NOMINATIM_REFERER:-}
            NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
            NOMINATIM_TIMEOUT: ${NOMINATIM_TIMEOUT:-15}
            NOMINATIM_MAX_RETRIES: ${NOMINATIM_MAX_RETRIES:-2}
            NOMINATIM_NEGATIVE_CACHE_DAYS: ${NOMINATIM_NEGATIVE_CACHE_DAYS:-30}
            NOMINATIM_RETRY_FAILED_DAYS: ${NOMINATIM_RETRY_FAILED_DAYS:-7}

            # Optional: Map vector tiles (OpenFreeMap) & 3D/hillshade terrain (Mapterhorn)
            MAPS_ENABLED: ${MAPS_ENABLED:-true}
            MAP_TILES_ENABLED: ${MAP_TILES_ENABLED:-}
            MAP_TERRAIN_ENABLED: ${MAP_TERRAIN_ENABLED:-}
            MAP_STYLE_LIGHT_URL: ${MAP_STYLE_LIGHT_URL:-}
            MAP_STYLE_DARK_URL: ${MAP_STYLE_DARK_URL:-}
            MAP_TERRAIN_TILEJSON_URL: ${MAP_TERRAIN_TILEJSON_URL:-}

            # Optional: Automated drop-folder import (.fit / .zip files)
            AUTO_IMPORT_DIR: ${AUTO_IMPORT_DIR:-}
            AUTO_IMPORT_MODE: ${AUTO_IMPORT_MODE:-keep}
            AUTO_IMPORT_MIN_FILE_AGE_SECONDS: ${AUTO_IMPORT_MIN_FILE_AGE_SECONDS:-5}

            # Reverse proxy & HTTPS settings (uncomment/configure behind Caddy, Traefik,
            # Nginx, Tailscale Serve, or Cloudflare Tunnels)
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
            SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}

            # Logging & SQLite concurrency
            LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
            DB_SQLITE_JOURNAL_MODE: ${DB_SQLITE_JOURNAL_MODE:-WAL}
            DB_SQLITE_BUSY_TIMEOUT: ${DB_SQLITE_BUSY_TIMEOUT:-5000}

            # Optional: leave blank to auto-generate and persist in /data/.app_key
            APP_KEY: ${APP_KEY:-}
        volumes:
            # Persistent SQLite database (/data/database.sqlite) and auto-generated APP_KEY (/data/.app_key)
            - splitline_data:/data
            # Cached Garmin FIT archive ZIPs for offline Best Effort recalculation
            - splitline_fits:/var/www/html/storage/app/private

volumes:
    splitline_data:
    splitline_fits:
